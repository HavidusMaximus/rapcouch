<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RAPCOUCH — Freestyle Word Generator</title>
<style>
  @font-face {
    font-family: 'Anton';
    src: local('Anton');
  }
  :root{
    --bg: #0a0a0a;
    --bg-raised: #121212;
    --fg: #ededea;
    --fg-dim: #6b6b68;
    --accent: #ff4d1c;
    --accent-dim: #5a2210;
    --line: #232320;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
    user-select:none;
  }
  #app{
    height:100vh; height:100dvh; width:100vw;
    display:flex; flex-direction:column;
    justify-content:space-between;
    padding: 20px 24px;
    position:relative;
  }

  /* ---------- top bar ---------- */
  #topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px;
    font-family: 'JetBrains Mono','SFMono-Regular',Consolas,monospace;
  }
  .brand{
    font-family: Arial Black, Arial, sans-serif;
    font-weight:900;
    letter-spacing: 0.14em;
    font-size: 13px;
    color: var(--fg-dim);
  }
  .brand b{ color: var(--fg); }

  #bpmBlock{ display:flex; align-items:center; gap:8px; }
  #bpmVal{
    font-size: 20px; font-weight:700; min-width: 3ch; text-align:center;
    font-variant-numeric: tabular-nums;
    color: var(--fg);
  }
  #bpmLabel{ font-size:11px; color:var(--fg-dim); letter-spacing:0.08em; }
  .bpmStep{
    width:24px; height:24px; border-radius:4px;
    background: var(--bg-raised); border:1px solid var(--line);
    color: var(--fg); font-size:15px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none; font-weight:700;
    font-family: 'JetBrains Mono',monospace;
  }
  .bpmStep:active{ background: var(--line); }
  input[type=range]{
    -webkit-appearance:none; appearance:none;
    width: 100px; height: 3px; background: var(--line);
    border-radius: 2px; outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:14px; height:14px; border-radius:50%;
    background: var(--accent); cursor:pointer;
    box-shadow: 0 0 0 4px rgba(255,77,28,0.15);
  }
  input[type=range]::-moz-range-thumb{
    width:14px; height:14px; border-radius:50%;
    background: var(--accent); border:none; cursor:pointer;
  }

  iconbtn, .iconbtn{
    display:flex; align-items:center; justify-content:center;
    width:38px; height:38px;
    background: transparent; border: 1px solid var(--line);
    border-radius: 4px; color: var(--fg-dim);
    cursor:pointer;
  }
  .iconbtn:active{ background: var(--bg-raised); }
  .iconbtn svg{ width:16px; height:16px; }

  /* ---------- word stage ---------- */
  #stage{
    flex:1;
    display:flex; align-items:center; justify-content:center;
    position:relative;
    min-height:0;
  }
  #word{
    font-family: 'Anton', 'Arial Black', Arial, sans-serif;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.01em;
    line-height: 0.95;
    text-align:center;
    color: var(--fg);
    transition: opacity 0.06s linear, color 0.08s linear;
    white-space: nowrap;
    max-width: 100%;
    padding: 0 8px;
  }
  #word.hit{
    color: var(--accent);
    text-shadow: 0 0 40px rgba(255,77,28,0.35);
  }

  #statusrow{
    text-align:center;
    margin-top: 6px;
  }
  #category{
    font-family:'JetBrains Mono',monospace;
    font-size:11px; letter-spacing:0.2em; color:var(--fg-dim);
  }

  /* ---------- beat row ---------- */
  #beatrow{
    display:flex; align-items:center; justify-content:center; gap:14px;
  }
  .dot{
    width:10px; height:10px; border-radius:50%;
    background: var(--line);
    transition: transform 0.08s ease, background 0.08s ease;
  }
  .dot.on{
    background: var(--fg-dim);
    transform: scale(1.3);
  }
  .dot.four{ }
  .dot.four.on{
    background: var(--accent);
    transform: scale(1.7);
    box-shadow: 0 0 16px rgba(255,77,28,0.7);
  }

  /* ---------- bottom controls ---------- */
  #controls{
    display:flex; align-items:center; justify-content:center; gap:14px;
  }
  #playBtn{
    width:64px; height:64px; border-radius:50%;
    background: var(--accent); border:none;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:#0a0a0a;
    box-shadow: 0 0 0 0 rgba(255,77,28,0.4);
  }
  #playBtn svg{ width:22px; height:22px; }
  #playBtn.playing{ animation: none; }

  #nextBtn, #fsBtn, #filterBtn{
    width:48px; height:48px; border-radius:50%;
    background: var(--bg-raised); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--fg);
    position:relative;
  }
  #nextBtn svg, #fsBtn svg, #filterBtn svg{ width:18px; height:18px; }
  #filterBtn.active{ border-color: var(--accent); color: var(--accent); }
  #filterBtn .dot-badge{
    display:none;
    position:absolute; top:2px; right:2px;
    width:7px; height:7px; border-radius:50%;
    background: var(--accent);
  }
  #filterBtn.active .dot-badge{ display:block; }

  /* ---------- filter panel ---------- */
  #filterOverlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55);
    display:none; align-items:flex-end; justify-content:center;
    z-index:20;
  }
  #filterOverlay.open{ display:flex; }
  #filterPanel{
    width:100%; max-width:420px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-bottom:none;
    border-radius: 14px 14px 0 0;
    padding: 18px 22px 26px;
  }
  .filterHead{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px;
  }
  .filterHead span{
    font-family:'JetBrains Mono',monospace;
    font-size:11px; letter-spacing:0.18em; color:var(--fg-dim);
  }
  #filterClose{
    width:28px; height:28px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color: var(--fg-dim); cursor:pointer; font-size:18px;
  }
  .filterRow{ margin-bottom:18px; }
  .filterRow:last-child{ margin-bottom:0; }
  .filterLabel{
    display:flex; justify-content:space-between; align-items:baseline;
    font-family:'JetBrains Mono',monospace;
    font-size:11px; letter-spacing:0.1em; color:var(--fg-dim);
    margin-bottom:8px;
  }
  .filterLabel b{ color: var(--fg); font-weight:700; }
  .rangeRow{ display:flex; align-items:center; gap:10px; }
  .rangeRow span{
    font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--fg-dim);
    width:16px; text-align:center;
  }
  .rangeRow input[type=range]{ flex:1; width:auto; }
  .chipRow{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{
    padding:8px 14px; border-radius:20px;
    background: var(--bg); border:1px solid var(--line);
    color: var(--fg-dim);
    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.04em;
    cursor:pointer;
  }
  .chip.active{
    border-color: var(--accent); color: var(--accent);
    background: rgba(255,77,28,0.08);
  }
  #poolInfo{
    text-align:center; margin-top:16px;
    font-family:'JetBrains Mono',monospace;
    font-size:10px; letter-spacing:0.1em; color: var(--fg-dim);
  }

  #hint{
    position:absolute; bottom:8px; left:0; right:0;
    text-align:center;
    font-family:'JetBrains Mono',monospace;
    font-size: 10px; letter-spacing:0.1em; color: var(--fg-dim);
    opacity:0.6;
  }

  #app.fs #topbar, #app.fs #hint, #app.fs #controls .secondary { }
  #app.fs #topbar{ opacity:0.15; transition: opacity 0.3s; }
  #app.fs:hover #topbar{ opacity:1; }
  #app.fs #beatrow{ opacity:0.4; }

  @media (max-width: 480px){
    #bpmBlock{ gap:5px; }
    input[type=range]{ width: 64px; }
    #bpmLabel{ display:none; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="brand">RAP<b>COUCH</b></div>
    <div id="bpmBlock">
      <span id="bpmLabel">BPM</span>
      <div class="bpmStep" id="bpmMinus" title="Langsamer">−</div>
      <span id="bpmVal">90</span>
      <div class="bpmStep" id="bpmPlus" title="Schneller">+</div>
      <input type="range" id="bpmSlider" min="50" max="180" value="90" step="1">
    </div>
    <div class="iconbtn" id="fsBtn" title="Vollbild">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    </div>
  </div>

  <div id="statusrow"><span id="category">BEREIT</span></div>

  <div id="stage">
    <div id="word">DRÜCK&nbsp;PLAY</div>
  </div>

  <div id="beatrow">
    <div class="dot" data-b="1"></div>
    <div class="dot" data-b="2"></div>
    <div class="dot" data-b="3"></div>
    <div class="dot four" data-b="4"></div>
  </div>

  <div id="controls">
    <div class="iconbtn" id="nextBtn" title="Nächstes Wort">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l10 8-10 8V4zm12 0h2v16h-2V4z"/></svg>
    </div>
    <button id="playBtn" title="Start/Stop">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <div class="iconbtn" id="filterBtn" title="Wortfilter">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="16" cy="12" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="11" cy="18" r="2" fill="currentColor" stroke="none"/></svg>
      <div class="dot-badge"></div>
    </div>
  </div>

  <div id="hint">LEERTASTE = START/STOP &nbsp;·&nbsp; N = NÄCHSTES WORT &nbsp;·&nbsp; F = VOLLBILD</div>
</div>

<div id="filterOverlay">
  <div id="filterPanel">
    <div class="filterHead">
      <span>WORTFILTER</span>
      <div id="filterClose">×</div>
    </div>

    <div class="filterRow">
      <div class="filterLabel">
        <span>WORTLÄNGE</span>
        <b id="lenRangeVal">4–12 ZEICHEN</b>
      </div>
      <div class="rangeRow">
        <span>MIN</span>
        <input type="range" id="lenMin" min="4" max="12" value="4" step="1">
      </div>
      <div class="rangeRow">
        <span>MAX</span>
        <input type="range" id="lenMax" min="4" max="12" value="12" step="1">
      </div>
    </div>

    <div class="filterRow">
      <div class="filterLabel"><span>KOMPLEXITÄT</span></div>
      <div class="chipRow" id="complexityChips">
        <div class="chip active" data-c="alle">Alle</div>
        <div class="chip" data-c="einfach">Einfach</div>
        <div class="chip" data-c="mittel">Mittel</div>
        <div class="chip" data-c="schwer">Schwer</div>
      </div>
    </div>

    <div id="poolInfo">— WÖRTER IM POOL</div>
  </div>
</div>

<script src="words.js"></script>
<script>

/* ---------------- state ---------------- */
const state = {
  bpm: 90,
  playing: false,
  beat: 0,          // 0..3  (0 = Schlag 1)
  timer: null,
  lastWord: null,
  history: [],
  lenMin: 4,
  lenMax: 12,
  complexity: 'alle',
  pool: WORDS,
};

const el = {
  word: document.getElementById('word'),
  category: document.getElementById('category'),
  bpmVal: document.getElementById('bpmVal'),
  bpmSlider: document.getElementById('bpmSlider'),
  bpmMinus: document.getElementById('bpmMinus'),
  bpmPlus: document.getElementById('bpmPlus'),
  playBtn: document.getElementById('playBtn'),
  playIcon: document.getElementById('playIcon'),
  nextBtn: document.getElementById('nextBtn'),
  fsBtn: document.getElementById('fsBtn'),
  app: document.getElementById('app'),
  stage: document.getElementById('stage'),
  dots: Array.from(document.querySelectorAll('.dot')),
  filterBtn: document.getElementById('filterBtn'),
  filterOverlay: document.getElementById('filterOverlay'),
  filterClose: document.getElementById('filterClose'),
  lenMin: document.getElementById('lenMin'),
  lenMax: document.getElementById('lenMax'),
  lenRangeVal: document.getElementById('lenRangeVal'),
  complexityChips: Array.from(document.querySelectorAll('#complexityChips .chip')),
  poolInfo: document.getElementById('poolInfo'),
};

/* ---------------- word meta & filtering ---------------- */
// Komplexität wird über die Silbenanzahl geschätzt (Vokalgruppen) —
// mehr Silben = schwerer im Flow zu platzieren.
function estimateSyllables(word){
  const groups = word.toLowerCase().match(/[aeiouyäöüáàéèíìóòúù]+/g);
  return groups ? groups.length : 1;
}
function complexityOf(syl){
  if (syl <= 2) return 'einfach';
  if (syl === 3) return 'mittel';
  return 'schwer';
}

const WORD_META = WORDS.map(w => {
  const syl = estimateSyllables(w);
  return { w, len: w.length, c: complexityOf(syl) };
});

function rebuildPool(){
  const { lenMin, lenMax, complexity } = state;
  const pool = [];
  for (let i = 0; i < WORD_META.length; i++){
    const m = WORD_META[i];
    if (m.len < lenMin || m.len > lenMax) continue;
    if (complexity !== 'alle' && m.c !== complexity) continue;
    pool.push(m.w);
  }
  state.pool = pool.length ? pool : WORDS;
  el.poolInfo.textContent = pool.length
    ? `${pool.length.toLocaleString('de-DE')} WÖRTER IM POOL`
    : 'KEINE TREFFER — ZEIGE ALLE WÖRTER';
  el.filterBtn.classList.toggle('active',
    state.lenMin > 4 || state.lenMax < 12 || state.complexity !== 'alle');
}

function pickWord(){
  let w;
  let tries = 0;
  const src = state.pool;
  do {
    w = src[Math.floor(Math.random() * src.length)];
    tries++;
  } while (state.history.includes(w) && tries < 8);
  state.history.push(w);
  if (state.history.length > 40) state.history.shift();
  return w;
}

function fitWord(){
  const isFS = el.stage.classList.contains('fs');
  const maxPx = isFS
    ? Math.min(window.innerWidth * 0.16, 220)
    : Math.min(window.innerWidth * 0.13, 130);
  const minPx = 18;
  const maxWidth = el.stage.clientWidth * 0.92;

  let size = maxPx;
  el.word.style.fontSize = size + 'px';
  while (el.word.scrollWidth > maxWidth && size > minPx){
    size -= 2;
    el.word.style.fontSize = size + 'px';
  }
}

function showWord(){
  const w = pickWord();
  el.word.textContent = w;
  fitWord();
  el.word.classList.add('hit');
  setTimeout(()=> el.word.classList.remove('hit'), 180);
}

window.addEventListener('resize', fitWord);

function tickBeat(){
  // advance beat 0..3, beat index 3 == "4. Schlag"
  el.dots.forEach(d => d.classList.remove('on'));
  el.dots[state.beat].classList.add('on');

  if (state.beat === 3){
    showWord();
  }

  state.beat = (state.beat + 1) % 4;
}

function intervalMs(){
  return 60000 / state.bpm;
}

function startClock(){
  stopClock();
  state.beat = 0;
  // fire first beat immediately, then on interval
  tickBeat();
  state.timer = setInterval(tickBeat, intervalMs());
}
function stopClock(){
  if (state.timer) clearInterval(state.timer);
  state.timer = null;
}

function setPlaying(p){
  state.playing = p;
  if (p){
    el.playBtn.classList.add('playing');
    el.playIcon.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
    el.category.textContent = 'LIVE';
    startClock();
  } else {
    el.playBtn.classList.remove('playing');
    el.playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    el.category.textContent = 'PAUSE';
    stopClock();
    el.dots.forEach(d => d.classList.remove('on'));
  }
}

/* ---------------- events ---------------- */
el.playBtn.addEventListener('click', () => setPlaying(!state.playing));

el.nextBtn.addEventListener('click', () => {
  showWord();
  if (state.playing){
    // resync clock so next auto-word doesn't land too soon
    state.beat = 0;
    stopClock();
    state.timer = setInterval(tickBeat, intervalMs());
    el.dots.forEach(d => d.classList.remove('on'));
  }
});

function setBpm(v){
  const min = parseInt(el.bpmSlider.min, 10);
  const max = parseInt(el.bpmSlider.max, 10);
  state.bpm = Math.max(min, Math.min(max, v));
  el.bpmVal.textContent = state.bpm;
  el.bpmSlider.value = state.bpm;
  if (state.playing) startClock();
}

el.bpmSlider.addEventListener('input', (e) => {
  setBpm(parseInt(e.target.value, 10));
});
el.bpmMinus.addEventListener('click', () => setBpm(state.bpm - 1));
el.bpmPlus.addEventListener('click', () => setBpm(state.bpm + 1));

el.fsBtn.addEventListener('click', toggleFullscreen);
el.stage.addEventListener('dblclick', toggleFullscreen);

/* ---------------- filter panel ---------------- */
function openFilterPanel(){ el.filterOverlay.classList.add('open'); }
function closeFilterPanel(){ el.filterOverlay.classList.remove('open'); }

el.filterBtn.addEventListener('click', openFilterPanel);
el.filterClose.addEventListener('click', closeFilterPanel);
el.filterOverlay.addEventListener('click', (e) => {
  if (e.target === el.filterOverlay) closeFilterPanel();
});

function updateLenLabel(){
  el.lenRangeVal.textContent = `${state.lenMin}–${state.lenMax} ZEICHEN`;
}

el.lenMin.addEventListener('input', (e) => {
  let v = parseInt(e.target.value, 10);
  if (v > state.lenMax){ v = state.lenMax; e.target.value = v; }
  state.lenMin = v;
  updateLenLabel();
  rebuildPool();
});
el.lenMax.addEventListener('input', (e) => {
  let v = parseInt(e.target.value, 10);
  if (v < state.lenMin){ v = state.lenMin; e.target.value = v; }
  state.lenMax = v;
  updateLenLabel();
  rebuildPool();
});

el.complexityChips.forEach(chip => {
  chip.addEventListener('click', () => {
    el.complexityChips.forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    state.complexity = chip.dataset.c;
    rebuildPool();
  });
});

function toggleFullscreen(){
  if (!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(()=>{});
  } else {
    document.exitFullscreen().catch(()=>{});
  }
}
document.addEventListener('fullscreenchange', () => {
  el.app.classList.toggle('fs', !!document.fullscreenElement);
  el.stage.classList.toggle('fs', !!document.fullscreenElement);
  fitWord();
});

document.addEventListener('keydown', (e) => {
  if (e.code === 'Escape'){ closeFilterPanel(); return; }
  if (el.filterOverlay.classList.contains('open')) return;
  if (e.code === 'Space'){ e.preventDefault(); setPlaying(!state.playing); }
  if (e.code === 'KeyN'){ el.nextBtn.click(); }
  if (e.code === 'KeyF'){ toggleFullscreen(); }
});

/* init */
rebuildPool();
el.category.textContent = `${WORDS.length.toLocaleString('de-DE')} WÖRTER GELADEN`;
fitWord();
</script>
</body>
</html>
