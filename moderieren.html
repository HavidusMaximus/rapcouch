<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RAPCOUCH – Moderation</title>
<style>
  :root{--bg:#0a0a0a;--raised:#121212;--fg:#ededea;--dim:#858580;--accent:#ff4d1c;--line:#292925}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Arial,sans-serif}
  body{padding:22px 16px 40px;max-width:520px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px;letter-spacing:.04em}
  .sub{font:11px monospace;letter-spacing:.08em;color:var(--dim);margin-bottom:18px}
  .panel{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:14px;margin:14px 0}
  input{width:100%;font-size:16px;padding:12px;border-radius:8px;background:#090909;border:1px solid var(--line);color:var(--fg);margin:5px 0 10px}
  button{border:0;border-radius:8px;font-weight:800;letter-spacing:.04em;cursor:pointer;font-size:14px;padding:12px}
  .go{background:var(--accent);color:#090909;width:100%}
  .muted{background:#242420;color:var(--fg)}
  #status{margin:14px 0;font:12px monospace;color:var(--dim);line-height:1.5}
  #status.err{color:#ff8a70}#status.ok{color:var(--accent)}
  #list{display:flex;flex-direction:column;gap:10px;margin-top:8px}
  .item{display:flex;align-items:center;gap:10px;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:12px}
  .item .w{flex:1;font-size:22px;font-weight:700;word-break:break-word}
  .item button{width:54px;height:44px;font-size:20px;padding:0}
  .yes{background:var(--accent);color:#090909}.no{background:#1c1c1a;color:var(--fg);border:1px solid var(--line)}
  .empty{color:var(--dim);text-align:center;padding:28px 0;font-size:14px}
  .fine{margin-top:22px;font-size:12px;color:var(--dim);line-height:1.5}
  #app{display:none}
</style>
</head>
<body>
  <h1>RAPCOUCH · Moderation</h1>
  <div class="sub">GESCHÜTZTER ZUGANG FÜR MODERATORINNEN</div>

  <section id="login" class="panel">
    <strong>Mit deinem RapCouch-Konto anmelden</strong>
    <input id="email" type="email" autocomplete="username" placeholder="E-Mail-Adresse">
    <input id="password" type="password" autocomplete="current-password" placeholder="Passwort">
    <button class="go" id="loginBtn" type="button">ANMELDEN</button>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="muted" id="forgotBtn" type="button" style="flex:1">PASSWORT VERGESSEN?</button>
      <a href="register.html" style="flex:1;text-decoration:none"><button class="muted" type="button" style="width:100%">KONTO ANFRAGEN</button></a>
    </div>
  </section>

  <div id="app">
    <div class="panel">
      <div id="identity"></div>
      <button class="muted" id="logoutBtn" type="button" style="margin-top:10px;width:100%">ABMELDEN</button>
    </div>
    <div id="status">Lade wartende Wörter …</div>
    <div id="list"></div>
    <button class="muted" id="rejectAll" type="button" style="display:none;width:100%;margin-top:16px">ALLE ABLEHNEN</button>
    <div class="fine">Freigaben werden deinem persönlichen Konto zugeordnet. Nur aktive ModeratorInnen und AdministratorInnen können Wörter freigeben oder ablehnen.</div>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="audience-config.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const event = audienceEventFromUrl();
  const base = 'audience/' + event;
  let currentUser = null;
  let staff = null;
  let db = null;
  let suggestionsRef = null;
  const pending = new Map();      // Firebase-Key -> {w, t}
  const timers = new Map();       // Firebase-Key -> Timeout (Einblend-Verzögerung)
  let offsetRef = null;
  let errUntil = 0;
  const SHOW_DELAY_MS = 2500;     // so lange warten, damit der Beamer bekannte Wörter vorher selbst abräumen kann (sonst Flackern)

  function status(t, cls){
    $('status').textContent=t; $('status').className=cls||'';
    if(cls==='err') errUntil=Date.now()+6000;
  }
  // Gleiche Wörter (egal ob Groß-/Kleinschreibung) werden zu einer Zeile zusammengefasst.
  function groups(){
    const m=new Map();
    for(const [id,v] of pending.entries()){
      const k=v.w.toLowerCase();
      let g=m.get(k);
      if(!g){g={w:v.w,ids:[],t:v.t};m.set(k,g);}
      g.ids.push(id); g.t=Math.min(g.t,v.t);
    }
    return Array.from(m.values()).sort((a,b)=>a.t-b.t);
  }
  function render(){
    const list=$('list'); list.textContent='';
    const items=groups();
    $('rejectAll').style.display=items.length?'':'none';
    armRejectAll(false);
    if(!items.length){
      const d=document.createElement('div');d.className='empty';d.textContent='Nichts zu prüfen.';list.appendChild(d);
      if(Date.now()>=errUntil) status('Keine wartenden Wörter.','ok');
      return;
    }
    for(const g of items){
      const row=document.createElement('div');row.className='item';
      const w=document.createElement('div');w.className='w';w.textContent=g.w;
      if(g.ids.length>1){const n=document.createElement('span');n.textContent=' ×'+g.ids.length;n.style.cssText='font-size:14px;color:var(--dim);font-weight:400';w.appendChild(n);}
      const yes=document.createElement('button');yes.className='yes';yes.textContent='✓';yes.title='Freigeben';
      const no=document.createElement('button');no.className='no';no.textContent='✗';no.title='Ablehnen';
      yes.addEventListener('click',()=>approve(g));
      no.addEventListener('click',()=>reject(g));
      row.append(w,yes,no);list.appendChild(row);
    }
    if(Date.now()>=errUntil) status(items.length===1?'1 Wort wartet auf Prüfung.':items.length+' Wörter warten auf Prüfung.','ok');
  }
  function detach(){
    if(suggestionsRef){suggestionsRef.off();suggestionsRef=null;}
    if(offsetRef){offsetRef.off();offsetRef=null;}
    timers.forEach(t=>clearTimeout(t));timers.clear();
    pending.clear();
  }
  function attach(){
    detach();
    // Serverzeit statt Geräteuhr: eine falsch gehende Uhr blendet sonst gültige Wörter aus.
    offsetRef=db.ref('.info/serverTimeOffset');
    offsetRef.on('value',snap=>{audienceServerOffset=Number(snap.val())||0;});
    suggestionsRef=db.ref(base+'/suggestions');
    suggestionsRef.on('child_added',snap=>{
      const v=snap.val()||{};
      const w=audienceNormalizeWord(v.w);
      if(!w) return;
      if(v.t && audienceNow()-v.t>AUDIENCE_CONFIG.maxAgeHours*3600000){
        snap.ref.remove().catch(()=>{});   // Überbleibsel einer alten Session aufräumen, nicht nur ausblenden
        return;
      }
      clearTimeout(timers.get(snap.key));
      timers.set(snap.key,setTimeout(()=>{
        timers.delete(snap.key);
        pending.set(snap.key,{w,t:v.t||audienceNow()});render();
      },SHOW_DELAY_MS));
    },err=>{
      status('Kein Zugriff auf die Wörter ('+(err&&err.message||err)+'). Bitte neu anmelden oder bei der Administration melden.','err');
    });
    suggestionsRef.on('child_removed',snap=>{
      clearTimeout(timers.get(snap.key));timers.delete(snap.key);
      pending.delete(snap.key);render();
    });
    render();
  }
  const sugRef=id=>db.ref(base+'/suggestions/'+id);
  async function approve(g){
    if(!currentUser||!staff||!staff.active)return;
    try{
      // Nur freigeben, wenn mindestens ein Eintrag noch existiert (Beamer oder andere Moderation war evtl. schneller).
      const snaps=await Promise.all(g.ids.map(id=>sugRef(id).once('value')));
      const alive=g.ids.filter((id,i)=>snaps[i].exists());
      if(!alive.length){g.ids.forEach(id=>pending.delete(id));render();return;}
      await db.ref(base+'/approved').push({
        w:g.w,
        by:currentUser.uid,
        t:firebase.database.ServerValue.TIMESTAMP
      });
      await Promise.all(alive.map(id=>sugRef(id).remove()));
      g.ids.forEach(id=>pending.delete(id));render();
    }catch(e){status('Freigabe fehlgeschlagen: '+(e.message||e),'err');}
  }
  async function reject(g){
    try{
      await Promise.all(g.ids.map(id=>sugRef(id).remove()));
      g.ids.forEach(id=>pending.delete(id));render();
    }catch(e){status('Ablehnen fehlgeschlagen: '+(e.message||e),'err');}
  }
  // "Alle ablehnen" braucht zwei Tipps kurz hintereinander (Schutz vor Versehen).
  let armTimer=null;
  function armRejectAll(on){
    clearTimeout(armTimer);
    $('rejectAll').textContent=on?'SICHER? NOCHMAL TIPPEN':'ALLE ABLEHNEN';
    $('rejectAll').dataset.armed=on?'1':'';
    if(on) armTimer=setTimeout(()=>armRejectAll(false),3000);
  }
  async function checkStaff(user){
    const snap=await db.ref('staff/'+user.uid).once('value');
    const value=snap.val();
    if(!value || value.active!==true || !['moderator','admin'].includes(value.role)) return null;
    return value;
  }

  try{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.database();}
  catch(e){$('login').style.display='block';$('login').querySelector('strong').textContent='Firebase konnte nicht initialisiert werden.';return;}

  $('loginBtn').addEventListener('click',async()=>{
    $('loginBtn').disabled=true;
    try{await firebase.auth().signInWithEmailAndPassword($('email').value.trim(),$('password').value);}
    catch(e){statusLogin('Anmeldung fehlgeschlagen: '+(e.message||e));}
    finally{$('loginBtn').disabled=false;}
  });
  function statusLogin(t){let el=$('loginError');if(!el){el=document.createElement('div');el.id='loginError';el.style.cssText='color:#ff8a70;font:12px monospace;margin-top:10px';$('login').appendChild(el);}el.textContent=t;}

  $('logoutBtn').addEventListener('click',()=>firebase.auth().signOut());
  $('forgotBtn').addEventListener('click',async()=>{
    const email=$('email').value.trim();
    if(!email){statusLogin('Bitte zuerst oben die E-Mail-Adresse eintragen.');return;}
    try{
      firebase.auth().languageCode='de';
      await firebase.auth().sendPasswordResetEmail(email);
    }catch(e){
      if(e.code==='auth/invalid-email'){statusLogin('Das ist keine gültige E-Mail-Adresse.');return;}
      if(e.code!=='auth/user-not-found'){statusLogin('Versand fehlgeschlagen: '+(e.message||e));return;}
    }
    statusLogin('Falls ein Konto zu dieser Adresse existiert, wurde eine E-Mail zum Zurücksetzen verschickt (bitte auch den Spam-Ordner prüfen).');
  });
  $('rejectAll').addEventListener('click',async()=>{
    if($('rejectAll').dataset.armed!=='1'){armRejectAll(true);return;}
    armRejectAll(false);
    for(const g of groups()) await reject(g);
  });

  firebase.auth().onAuthStateChanged(async user=>{
    detach();currentUser=user;staff=null;
    if(!user){$('login').style.display='';$('app').style.display='none';return;}
    try{staff=await checkStaff(user);}
    catch(e){staff=null;}
    if(!staff){
      await firebase.auth().signOut();
      $('login').style.display='';$('app').style.display='none';
      statusLogin('Dieser Account besitzt keine aktive Moderationsberechtigung. Falls du dich gerade erst registriert hast, muss ein Admin dich noch freischalten.');
      return;
    }
    $('login').style.display='none';$('app').style.display='block';
    $('identity').textContent=(staff.displayName||user.email)+' · '+staff.role;
    attach();
  });
})();
</script>
</body>
</html>
